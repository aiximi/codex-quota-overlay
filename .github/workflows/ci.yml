name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - README.md
      - README.en.md
      - DOWNLOADS.md
      - docs/VERSIONS.md
      - docs/releases/catalog.json
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  desktop:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QUOTA_TARGET_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check Windows helper syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/native/windows/WindowTracker.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; exit 1 }
      - run: npm run test:ui
      - name: Build downloadable packages
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify Windows installation and custom directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            test-results/
            playwright-report/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the version and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          if (!/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(tag)) throw new Error('Use a stable vX.Y.Z release tag.');
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (tag !== `v${version}`) throw new Error('The tag must match package.json version.');
          const notes = readFileSync(`docs/releases/${tag}.md`, 'utf8');
          const changes = notes.split(/^## 更新内容\s*$/m)[1]?.split(/^## /m)[0];
          if (!changes || !/^- \S/m.test(changes)) {
            throw new Error('Release notes require a ## 更新内容 section with concrete top-level bullet points.');
          }
          const documents = `https://github.com/${process.env.RELEASE_REPOSITORY}/blob/${process.env.DEFAULT_BRANCH}`;
          for (const file of ['DOWNLOADS.md', 'docs/VERSIONS.md']) {
            if (!notes.includes(`${documents}/${file}`)) {
              throw new Error(`Release notes must link to the unified ${file} page.`);
            }
          }
          NODE
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --title "Codex Quota Overlay $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
