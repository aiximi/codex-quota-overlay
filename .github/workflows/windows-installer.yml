name: Verify published Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag (v2.0.0 or windows-v2.0.1)
        required: true
        default: v2.0.0
        type: string

permissions:
  contents: read

jobs:
  installation:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^(?:windows-)?v(?<version>\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?)$') {
            throw 'Provide a release tag such as v2.0.0 or windows-v2.0.1.'
          }
          $version = $Matches['version']
          $file = "Codex-Quota-Overlay-$version-windows-x64-setup.exe"
          gh release download $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --pattern $file --pattern SHA256SUMS.txt --dir release
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed.' }
          $lines = @(Get-Content release/SHA256SUMS.txt | Where-Object { $_ -match ('^[a-fA-F0-9]{64}\s+\*?' + [regex]::Escape($file) + '$') })
          if ($lines.Count -ne 1) { throw 'The installer is missing from the published checksums.' }
          $expected = ($lines[0] -split '\s+')[0]
          $actual = (Get-FileHash (Join-Path release $file) -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'The downloaded installer checksum does not match.' }
          Write-Output 'The installer matches the published SHA-256 checksum.'
      - name: Verify directory selection, install, launch and uninstall
        shell: pwsh
        run: ./scripts/test-windows-install.ps1
      - name: Save installation verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installation-evidence
          path: test-results/windows-installation/
          if-no-files-found: warn
